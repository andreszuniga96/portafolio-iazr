<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur1"/>
      <feGaussianBlur stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" fill="#080a0a"/>

  <!-- Vertical stroke of the "I" — geometric sans-serif style -->
  <rect x="28" y="12" width="8" height="36" rx="1" fill="#00E5FF" filter="url(#glow)"/>

  <!-- Underline accent -->
  <rect x="20" y="52" width="24" height="2" rx="1" fill="#00E5FF" opacity="0.7"/>
</svg>